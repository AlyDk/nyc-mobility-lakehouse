bundle:
  name: nyc_mobility

variables:
  warehouse_id:
    description: Serverless Starter Warehouse
    default: 4f22b18ddd276212
  month:
    description: Month to (re)load, yyyy-MM
    default: "2024-12"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-23a9a835-4f0d.cloud.databricks.com

resources:
  jobs:
    nyc_mobility_pipeline:
      name: nyc_mobility_pipeline
      max_concurrent_runs: 1
      parameters:
        - name: start_month
          default: ${var.month}
        - name: end_month
          default: ${var.month}
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks==1.13.1
      tasks:
        - task_key: bronze_yellow
          notebook_task:
            notebook_path: ./databricks/10_bronze_ingest.py
            base_parameters:
              service: yellow
        - task_key: bronze_green
          notebook_task:
            notebook_path: ./databricks/10_bronze_ingest.py
            base_parameters:
              service: green
        - task_key: bronze_zones
          notebook_task:
            notebook_path: ./databricks/11_bronze_reference.py
        - task_key: silver_trips
          depends_on:
            - task_key: bronze_yellow
            - task_key: bronze_green
            - task_key: bronze_zones
          notebook_task:
            notebook_path: ./databricks/20_silver_trips.py
            base_parameters:
              mode: incremental
        - task_key: gold_dbt
          depends_on:
            - task_key: silver_trips
          environment_key: dbt_env
          dbt_task:
            project_directory: ./dbt
            commands:
              - dbt build
            warehouse_id: ${var.warehouse_id}
            catalog: nyc_mobility
            schema: gold