name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/4f22b18ddd276212
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: No data files committed
        run: |
          if git ls-files | grep -E '\.(parquet|csv|zip)$' | grep -v '^dbt/seeds/'; then
            echo "Data file committed"; exit 1
          fi

      - name: Databricks reachable
        run: python -c "from databricks.sdk import WorkspaceClient; WorkspaceClient().current_user.me(); print('Databricks reachable')"

      - uses: databricks/setup-cli@main

      - name: Bundle validate
        run: databricks bundle validate

      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir .